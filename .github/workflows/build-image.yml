name: Build - Build, Test & Publish Image (reusable)

# Builds one image/stream/variant with apko from its committed lock, tests and
# scans it natively on amd64 and arm64 and, once approved, pushes it by digest,
# signs it, attests its SBOM, SLSA provenance and a verification summary (VSA),
# and only then moves its tags. Consumers pin verification to this workflow:
# `.github/workflows/build-image.yml@refs/heads/main`.
#
# apko builds are reproducible: the same config and lock give the same digest,
# so a rebuild of an approved stream is a no-op apart from the rescan.

on:
  workflow_call:
    inputs:
      build:
        description: One entry of generated/catalog.json `builds` (JSON)
        required: true
        type: string
      registry:
        description: Repository prefix (e.g. ghcr.io/curantes/wolfi-images)
        required: true
        type: string
      promote:
        description: Push, sign, attest and tag the image
        required: false
        type: boolean
        default: false

permissions: {}

env:
  # apko from its container image, pinned by digest (Renovate updates it)
  APKO_IMAGE: cgr.dev/chainguard/apko:latest@sha256:d4874962858ee6b2ce55d198011f5ca5ea89ac3e277479b779ecfc3a2298e6a2
  NAME: ${{ fromJSON(inputs.build).name }}
  TAG: ${{ fromJSON(inputs.build).tag }}
  IMAGE: ${{ inputs.registry }}/${{ fromJSON(inputs.build).name }}
  VSA_PREDICATE: https://slsa.dev/verification_summary/v1

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install apko
        uses: ./.github/actions/setup-apko
        with:
          image: ${{ env.APKO_IMAGE }}

      - name: Build Image
        id: build
        env:
          CONFIG: ${{ fromJSON(inputs.build).config }}
          LOCK: ${{ fromJSON(inputs.build).lock }}
          PACKAGE: ${{ fromJSON(inputs.build).package }}
          STREAM: ${{ fromJSON(inputs.build).stream }}
        run: |
          [ -f "tests/$NAME/test.sh" ] || { echo "Missing tests/$NAME/test.sh"; exit 1; }
          [ -f "$LOCK" ] || { echo "Missing lock $LOCK; run scripts/lock.sh"; exit 1; }
          # Images without an upstream version (static) get no version tag.
          VERSION=""
          if [ -n "$PACKAGE" ]; then
            VERSION="$(scripts/version.sh "$LOCK" "$PACKAGE" "$STREAM")"
          fi
          mkdir -p out/sbom
          # Retry transient package download errors; the lock pins every byte.
          for attempt in 1 2 3; do
            apko build --lockfile "$LOCK" --sbom-path out/sbom "$CONFIG" "local/$NAME:$TAG" out/image.tar && break
            [ "$attempt" -lt 3 ] || { echo "apko build failed after 3 attempts"; exit 1; }
            echo "::warning::apko build failed (attempt $attempt); retrying"
            sleep $((attempt * 15))
          done
          DIGEST="$(python3 -I scripts/oci_layout.py out/image.tar out/layout)"
          ARCHS="$(tar -xOf out/image.tar index.json | jq -r '[.manifests[].platform.architecture] | sort | join(",")')"
          [ "$ARCHS" = "amd64,arm64" ] || { echo "Expected amd64 and arm64, got '$ARCHS'"; exit 1; }
          echo "Built $NAME:$TAG (${VERSION:-no version}) as $DIGEST"
          {
            echo "digest=$DIGEST"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ env.NAME }}-${{ env.TAG }}
          path: out/
          retention-days: 3
          if-no-files-found: error

  test-scan:
    name: Test & Scan (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    env:
      TEST_IMAGE: local/${{ fromJSON(inputs.build).name }}:${{ fromJSON(inputs.build).tag }}-${{ matrix.arch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ env.NAME }}-${{ env.TAG }}
          path: out

      # apko's tarball is docker-loadable and tags each platform
      # local/<name>:<tag>-<arch>.
      - name: Load Image
        run: |
          docker load -i out/image.tar
          docker image inspect "$TEST_IMAGE" > /dev/null

      - name: Run Container Tests
        run: bash "tests/$NAME/test.sh" "$TEST_IMAGE" "$TAG"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate Scan SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: '"$SYFT" -q "docker:$TEST_IMAGE" -o syft-json=sbom.syft.json'

      # A scanner that doesn't recognise the distro sees no packages and
      # reports zero vulnerabilities, so gate on detection first.
      - name: Verify Package Detection
        run: |
          DISTRO="$(jq -r '.distro.id // ""' sbom.syft.json)"
          PKGS="$(jq '[.artifacts[] | select(.type == "apk")] | length' sbom.syft.json)"
          echo "Detected distro '$DISTRO' with $PKGS APK packages"
          if [ "$DISTRO" != "wolfi" ] || [ "$PKGS" -eq 0 ]; then
            echo "Package detection failed; vulnerability results would be meaningless"
            exit 1
          fi

      - name: Install Grype
        id: grype-install
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: Update Grype Database
        env:
          GRYPE: ${{ steps.grype-install.outputs.cmd }}
        run: |
          for attempt in 1 2 3; do
            "$GRYPE" db update && exit 0
            [ "$attempt" -lt 3 ] || { echo "Grype database update failed after 3 attempts"; exit 1; }
            echo "::warning::Grype database update failed (attempt $attempt); retrying"
            sleep $((attempt * 15))
          done

      # Accepted findings go in vex/<name>.openvex.json (OpenVEX).
      - name: Collect VEX Documents
        id: vex
        run: |
          FILES="$(find vex -name '*.openvex.json' 2>/dev/null | paste -sd, -)"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Vulnerability Scan & Gate (Grype, fixable HIGH+)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        env:
          GRYPE_DB_AUTO_UPDATE: "false"
          GRYPE_VEX_DOCUMENTS: ${{ steps.vex.outputs.files }}
        with:
          sbom: sbom.syft.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Upload Grype Results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && steps.grype.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-${{ env.NAME }}-${{ env.TAG }}-${{ matrix.arch }}

      # Second opinion only; the Grype gate decides.
      - name: Cross-check with Trivy (non-blocking)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  publish:
    name: Publish
    needs: [build, test-scan]
    if: inputs.promote && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write      # Keyless signing via GitHub OIDC
      attestations: write  # Provenance, SBOM and VSA attestations
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      VERSION: ${{ needs.build.outputs.version }}
      STREAM: ${{ fromJSON(inputs.build).stream }}
      VARIANT: ${{ fromJSON(inputs.build).variant }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ env.NAME }}-${{ env.TAG }}
          path: out

      # Cosign first: the regctl installer verifies its download with it.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install regctl
        uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: v0.11.7

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: the image gets no tag until it is approved.
      - name: Push by Digest
        run: |
          for attempt in 1 2 3; do
            regctl image copy "ocidir://out/layout@$DIGEST" "$IMAGE@$DIGEST" && break
            [ "$attempt" -lt 3 ] || { echo "Push failed after 3 attempts"; exit 1; }
            echo "::warning::Push failed (attempt $attempt); retrying"
            sleep $((attempt * 15))
          done
          PUSHED="$(regctl image digest "$IMAGE@$DIGEST")"
          [ "$PUSHED" = "$DIGEST" ] || { echo "Digest changed during push: $PUSHED"; exit 1; }

      - name: Check for Existing Approval
        id: approval
        run: |
          if gh attestation verify "oci://$IMAGE@$DIGEST" --bundle-from-oci \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-image.yml" \
              --predicate-type "$VSA_PREDICATE" > /dev/null 2>&1; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "Digest already approved (reproducible rebuild); only refreshing tags"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign Image
        if: steps.approval.outputs.approved == 'false'
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"

      - name: Attest Build Provenance
        if: steps.approval.outputs.approved == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      # apko writes one SPDX SBOM for the index and one per platform; attach
      # each to the digest it describes so scanners find it per platform.
      - name: Attest SBOMs
        if: steps.approval.outputs.approved == 'false'
        run: |
          cosign attest --yes --type spdxjson --predicate out/sbom/sbom-index.spdx.json "$IMAGE@$DIGEST"
          tar -xOf out/image.tar index.json | jq -r '.manifests[] | "\(.platform.architecture) \(.digest)"' \
            | while read -r arch digest; do
                case "$arch" in amd64) apk_arch=x86_64 ;; arm64) apk_arch=aarch64 ;; esac
                cosign attest --yes --type spdxjson \
                  --predicate "out/sbom/sbom-$apk_arch.spdx.json" "$IMAGE@$digest"
              done

      - name: Write Verification Summary
        if: steps.approval.outputs.approved == 'false'
        run: |
          jq -n \
            --arg verifier "https://github.com/$GITHUB_REPOSITORY/.github/workflows/build-image.yml@$GITHUB_REF" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg resource "oci://$IMAGE@$DIGEST" \
            --arg policy "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/.github/workflows/build-image.yml" \
            --arg commit "$GITHUB_SHA" \
            '{
              verifier: { id: $verifier },
              timeVerified: $time,
              resourceUri: $resource,
              policy: { uri: $policy, digest: { gitCommit: $commit } },
              verificationResult: "PASSED",
              verifiedLevels: [
                "SLSA_BUILD_LEVEL_3",
                "SANITY_TESTS_PASSED",
                "NO_FIXABLE_HIGH_OR_CRITICAL_VULNERABILITIES"
              ],
              slsaVersion: "1.0"
            }' > vsa.json
          cat vsa.json

      - name: Attest Verification Summary (VSA)
        if: steps.approval.outputs.approved == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          predicate-type: ${{ env.VSA_PREDICATE }}
          predicate-path: vsa.json
          push-to-registry: true

      # Tags move only after approval. The timestamped tag is created once per
      # approval and never overwritten (GHCR has no tag immutability).
      - name: Move Tags
        id: tags
        env:
          APPROVED: ${{ steps.approval.outputs.approved }}
        run: |
          SUFFIX="${VARIANT:+-$VARIANT}"
          TAGS=("$TAG")
          if [ -n "$VERSION" ]; then TAGS+=("$VERSION$SUFFIX"); fi
          if [ "$APPROVED" = "false" ]; then
            UNIQUE="${VERSION:-$STREAM}$SUFFIX-$(date -u +%Y%m%dT%H%M%SZ)"
            if regctl image digest "$IMAGE:$UNIQUE" > /dev/null 2>&1; then
              echo "Tag $UNIQUE already exists; refusing to overwrite"
              exit 1
            fi
            TAGS+=("$UNIQUE")
          fi
          for t in "${TAGS[@]}"; do
            regctl image copy "$IMAGE@$DIGEST" "$IMAGE:$t"
          done
          echo "tags=${TAGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Write Job Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          APPROVED: ${{ steps.approval.outputs.approved }}
          STATUS: ${{ fromJSON(inputs.build).status }}
          EOL: ${{ fromJSON(inputs.build).eol }}
        run: |
          {
            echo "### Published \`$IMAGE@$DIGEST\`"
            echo
            echo "Version ${VERSION:-n/a}, stream $STREAM ($STATUS, EOL ${EOL:-n/a})"
            if [ "$APPROVED" = "true" ]; then echo; echo "Already approved; tags refreshed."; fi
            echo
            echo "Tags:"
            for t in $TAGS; do printf -- "- \`%s\`\n" "$t"; done
          } >> "$GITHUB_STEP_SUMMARY"
