name: Set up apko
description: >-
  Put an `apko` wrapper on PATH that runs apko from its container image,
  pinned by digest. The digest fixes the exact bytes without any online
  lookup; apko's release binaries are only verifiable through a Rekor log
  search, which made every build fail whenever Rekor's search API was down.

inputs:
  image:
    description: apko container image pinned by digest (<repo>:<tag>@sha256:<digest>)
    required: true

runs:
  using: composite
  steps:
    - name: Install apko Wrapper
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        if [[ "$IMAGE" != *@sha256:* ]]; then
          echo "apko image must be pinned by digest (got: $IMAGE)"
          exit 1
        fi
        for attempt in 1 2 3; do
          docker pull -q "$IMAGE" && break
          [ "$attempt" -lt 3 ] || { echo "Pulling $IMAGE failed after 3 attempts"; exit 1; }
          echo "::warning::Pulling apko failed (attempt $attempt); retrying"
          sleep $((attempt * 15))
        done
        DIR="$RUNNER_TEMP/apko/bin"
        mkdir -p "$DIR"
        # Runs as the runner's user with the working directory mounted at the
        # same path, so relative paths and output ownership behave like a
        # local binary.
        {
          echo '#!/usr/bin/env bash'
          echo 'exec docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \'
          echo '  -v "$PWD:$PWD" -w "$PWD" '"'$IMAGE'"' "$@"'
        } > "$DIR/apko"
        chmod +x "$DIR/apko"
        echo "$DIR" >> "$GITHUB_PATH"
        "$DIR/apko" version | tail -n 3
