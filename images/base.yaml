# Shared apko template for every image. scripts/generate.py merges each
# images/<name>/image.yaml into this and writes generated/<name>/<tag>.apko.yaml.
#
# Only the Wolfi repository is allowed, verified with the pinned key in
# keys/ (sha256 f0031424cf46f7db780ce63a45f0fd6aa6f85f601e6bb3b7a91fe3d4d5b7d2cc).
contents:
  keyring:
    - keys/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
      shell: /sbin/nologin
  run-as: "65532"

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: https://github.com/curantes/wolfi-images
  org.opencontainers.image.vendor: curantes
  org.opencontainers.image.licenses: Apache-2.0
